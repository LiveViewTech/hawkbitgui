analysis:
  purpose:
    value: "Standalone Next.js GUI for Eclipse Hawkbit that manages device update targets, distribution sets, software modules, artifacts, and rollouts through Hawkbit's Management REST API without embedding Hawkbit server code."
    confidence: high
    evidence_refs: ["lang-typescript", "fw-nextjs", "svc-hawkbit-api", "comp-deployment", "comp-services", "entry-hawkbit-proxy"]
  architecture:
    value: "Browser UI under src/app/x calls static service classes via a browser axios client pointed at /api/hawkbit; that Next.js catch-all route attaches Basic auth from the next-auth JWT and proxies to NEXT_PUBLIC_HAWKBIT_API_URL/rest/v1. Login validates credentials against Hawkbit /rest/v1/userinfo. Session redirects run in chained middleware. Feature pages use container/component folders, React Query for server data, and Zustand for table/UI state."
    confidence: high
    evidence_refs: ["entry-hawkbit-proxy", "entry-auth-options", "entry-middleware", "comp-services", "comp-lib", "fw-react-query", "fw-zustand", "comp-deployment"]
  patterns:
    - id: pat-container-component
      value: "Feature modules under src/app/x/<feature> split presentational components/ from stateful containers/ that wire stores, modals, and hooks."
      confidence: high
      evidence_refs: ["comp-deployment", "comp-distributions", "comp-rollout"]
    - id: pat-static-service-classes
      value: "Hawkbit REST calls live in static service classes under src/services that use the shared axios instance and return typed domain entities."
      confidence: high
      evidence_refs: ["comp-services", "fw-axios", "comp-entities"]
    - id: pat-react-query-plus-zustand
      value: "React Query owns server fetches/mutations; Zustand stores hold pagination, filters, selection, and other client UI state consumed by those hooks."
      confidence: high
      evidence_refs: ["fw-react-query", "fw-zustand", "comp-stores", "comp-deployment"]
    - id: pat-fiql-filters
      value: "List filters are composed via FilterFiql helpers in src/entities/filter.ts and sent as Hawkbit q/FIQL query params from services."
      confidence: high
      evidence_refs: ["comp-entities", "comp-services"]
    - id: pat-bff-proxy
      value: "All browser Hawkbit traffic goes through the authenticated /api/hawkbit BFF proxy rather than calling the Hawkbit host directly from the client."
      confidence: high
      evidence_refs: ["entry-hawkbit-proxy", "comp-lib", "svc-hawkbit-api"]
  component_notes:
    - ref: comp-app-shell
      purpose: "Next.js App Router root with session-aware layout, React Query/Session providers, login page, and authenticated /x feature area."
      confidence: high
    - ref: comp-api-routes
      purpose: "next-auth handler plus catch-all Hawkbit Management API proxy that injects Basic auth from the JWT."
      confidence: high
    - ref: comp-shared-ui
      purpose: "Reusable UI primitives (tables, forms, modals, layout chrome) shared across feature pages."
      confidence: high
    - ref: comp-deployment
      purpose: "Primary deployment workspace for targets and distribution assignment, including drag-and-drop layout and action history."
      confidence: high
    - ref: comp-distributions
      purpose: "CRUD and inspection UI for distribution sets, tags, metadata, and assigned software modules."
      confidence: high
    - ref: comp-rollout
      purpose: "Rollout create/edit/copy, approve/start/pause, and deploy-group target inspection."
      confidence: high
    - ref: comp-software-modules
      purpose: "Shared software-module UI (card/table/forms/metadata) embedded by upload and distributions pages; no dedicated page.tsx route."
      confidence: high
    - ref: comp-target-filters
      purpose: "Saved target filter management used when selecting device cohorts."
      confidence: high
    - ref: comp-upload
      purpose: "Artifact upload/download/delete for software modules, including client-side hash calculation."
      confidence: high
    - ref: comp-configuration
      purpose: "System configuration form UI backed by system-configuration-service."
      confidence: high
    - ref: comp-services
      purpose: "Typed static clients for Hawkbit REST resources (targets, distributions, modules, rollouts, tags, config)."
      confidence: high
    - ref: comp-entities
      purpose: "Domain types, status constants, type guards, and FIQL filter helpers shared by services and UI."
      confidence: high
    - ref: comp-stores
      purpose: "Zustand stores for table pagination, filters, tags, and page-local UI state."
      confidence: high
    - ref: comp-lib
      purpose: "next-auth Credentials provider options and browser axios instance with 401 sign-out."
      confidence: high
    - ref: comp-middlewares
      purpose: "Composable middleware chain that redirects unauthenticated users to /login and authenticated users away from login."
      confidence: high
  service_notes:
    - ref: svc-hawkbit-api
      purpose: "Backend for all management operations and login validation."
      integration: "Configured via NEXT_PUBLIC_HAWKBIT_API_URL; proxied by src/app/api/hawkbit/[...path]/route.ts with Basic auth from the JWT hawkbitAuth claim; login hits /rest/v1/userinfo."
      confidence: high
    - ref: svc-hawkbit-docker
      purpose: "Local Hawkbit update server companion for docker-compose development."
      integration: "docker-compose.yml runs hawkbit/hawkbit-update-server:latest on port 8080 with CORS allowed for http://localhost:3000."
      confidence: high
  dangerous_areas:
    - id: danger-jwt-basic-auth
      value: "Hawkbit username/password Basic credentials are base64-encoded into JWT claim hawkbitAuth"
      reason: "Compromise of NEXTAUTH_SECRET or JWT material exposes reusable Hawkbit credentials; session callbacks intentionally omit hawkbitAuth from the client session, but the token still carries it server-side."
      confidence: high
      evidence_refs: ["entry-auth-options", "entry-hawkbit-proxy", "comp-lib"]
    - id: danger-cors-wildcard
      value: "next.config.ts sets Access-Control-Allow-Origin to * together with Allow-Credentials true on all routes"
      reason: "Wildcard ACAO with credentials is browser-invalid for credentialed cross-origin calls and is a footgun if this GUI is exposed beyond a trusted network."
      confidence: high
      evidence_refs: ["fw-nextjs"]
    - id: danger-large-upload-limit
      value: "Server Actions and proxy client body size limits are set to 4gb"
      reason: "Artifact uploads can accept very large bodies; misconfigured reverse proxies or abuse can exhaust memory/disk."
      confidence: high
      evidence_refs: ["fw-nextjs", "comp-upload"]
    - id: danger-insecure-hash-fallback
      value: "Artifact hashing falls back to crypto-js when Web Crypto subtle is unavailable"
      reason: "Comment in software-module-artifacts-service.ts marks this path for insecure HTTP local usage; do not treat it as a production crypto story."
      confidence: high
      evidence_refs: ["comp-upload", "dep-crypto-js", "dep-js-md5"]
  questions:
    - id: q-npm-vs-bun
      question: "README and package-lock.json document npm workflows, but Dockerfile installs/runs via bun and optionally copies bun.lockb. Which package manager is canonical for CI and production images?"
      area: build-tooling
      priority: high
    - id: q-no-automated-tests
      question: "No *.test.*/*.spec.* files, test script, or CI workflow were found. Is the absence of an automated test suite intentional?"
      area: testing
      priority: medium
    - id: q-auth-model-longevity
      question: "Is persisting Hawkbit Basic credentials inside the next-auth JWT the long-term auth design, or is a token-exchange / session-cookie approach planned?"
      area: security
      priority: high
      evidence_refs: ["entry-auth-options", "danger-jwt-basic-auth"]
    - id: q-cors-production-intent
      question: "Are the wildcard CORS headers in next.config.ts intentional for production deployments, or only a local-dev convenience?"
      area: security
      priority: medium
      evidence_refs: ["danger-cors-wildcard", "fw-nextjs"]
    - id: q-distribution-set-types-page
      question: "src/app/x/distribution-set-types has only a thin page surface compared with other /x features; is that area incomplete or intentionally minimal?"
      area: product-scope
      priority: low
      evidence_refs: ["comp-distributions"]
    - id: q-software-modules-routing
      question: "src/app/x/software-modules has components/containers/hooks but no page.tsx; is it intentionally only a shared embed for upload/distributions, or is a standalone route missing?"
      area: product-scope
      priority: low
      evidence_refs: ["comp-software-modules", "comp-upload"]
